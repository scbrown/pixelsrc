name: Release-plz

# On every push to main: open or update the release PR (version bump +
# CHANGELOG). When that PR merges: tag v<version>, create the GitHub release,
# then build the binaries, update the Homebrew tap and publish to crates.io
# with a separate crates workflow (its own OIDC workflow identity).
on:
  push:
    branches: [main]

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the new tag
        id: tag
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: echo "tag=$(echo "$RELEASES" | jq -r '.[0].tag')" >> "$GITHUB_OUTPUT"

  binaries:
    name: Binaries
    needs: release-plz
    if: needs.release-plz.outputs.releases_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-plz.outputs.tag }}

  homebrew:
    name: Homebrew tap
    needs: [release-plz, binaries]
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ needs.release-plz.outputs.tag }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  crates:
    name: Dispatch crates.io
    needs: release-plz
    if: needs.release-plz.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch the tagged crate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-plz.outputs.tag }}
        run: bash scripts/dispatch-crates.sh
