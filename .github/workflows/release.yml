name: Release

on:
  push:
    tags:
      - 'v*'
  # Called by release-plz.yml after it tags a release (a GITHUB_TOKEN tag push
  # cannot trigger the `tags` arm above).
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  # Build and verify the Linux binaries (no publish) whenever this workflow
  # changes, so a portability regression is caught before it can be released.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # Pull-request runs build an unpublished placeholder version.
  VERSION: ${{ inputs.tag || inputs.version || (github.event_name == 'pull_request' && 'v0.0.0-pr' || github.ref_name) }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: build on the OLDEST supported glibc, pinned (never
          # ubuntu-latest). A binary links against the build host's glibc, and
          # v0.4.0 built on ubuntu-latest needed GLIBC_2.43, so it would not
          # start on Ubuntu 24.04 or Debian 12/13. Both arches build natively.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            linux: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            archive: tar.gz
            linux: true
          # macOS
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        if: github.event_name != 'pull_request' || matrix.linux
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || env.VERSION }}

      - name: Install Rust
        if: github.event_name != 'pull_request' || matrix.linux
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: (github.event_name != 'pull_request' || matrix.linux) && (matrix.cross)
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        if: github.event_name != 'pull_request' || matrix.linux
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package (Unix)
        if: (github.event_name != 'pull_request' || matrix.linux) && (matrix.os != 'windows-latest')
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../pxl-${{ env.VERSION }}-${{ matrix.target }}.tar.gz pxl
          cd ../../..

      - name: Package (Windows)
        if: (github.event_name != 'pull_request' || matrix.linux) && (matrix.os == 'windows-latest')
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path pxl.exe -DestinationPath ../../../pxl-${{ env.VERSION }}-${{ matrix.target }}.zip
          cd ../../..

      - name: Upload artifact
        if: github.event_name != 'pull_request' || matrix.linux
        uses: actions/upload-artifact@v4
        with:
          name: pxl-${{ matrix.target }}
          path: pxl-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive }}

  verify-linux:
    # The release must not publish a Linux binary that fails to start on a
    # current LTS. Run the built artifact on Ubuntu 24.04 (and on the 22.04 build
    # floor), and refuse any GLIBC symbol newer than the 22.04 floor (2.35).
    name: Verify ${{ matrix.target }} on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: pxl-${{ matrix.target }}
          path: artifacts
      - name: Run the binary and check its glibc floor
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          tar xzf pxl-*.tar.gz
          ./pxl --version
          newest=$(objdump -T pxl | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "newest required glibc: $newest"
          if [ "$(printf '%s\n2.35\n' "$newest" | sort -V | tail -1)" != "2.35" ]; then
            echo "::error::pxl requires GLIBC_$newest, newer than the 2.35 floor"
            exit 1
          fi

  build-deb:
    name: Build Debian package
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Download Linux x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: pxl-x86_64-unknown-linux-gnu
          path: artifacts

      - name: Extract binary
        run: |
          cd artifacts
          tar xzf pxl-*.tar.gz
          chmod +x pxl

      - name: Build .deb package
        env:
          RELEASE_VERSION: ${{ env.VERSION }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          PKG_NAME="pxl"
          PKG_DIR="${PKG_NAME}_${VERSION}_amd64"

          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/bin"

          cp artifacts/pxl "${PKG_DIR}/usr/bin/"

          cat > "${PKG_DIR}/DEBIAN/control" << EOF
          Package: ${PKG_NAME}
          Version: ${VERSION}
          Section: graphics
          Priority: optional
          Architecture: amd64
          Maintainer: Pixelsrc Developers <pixelsrc@example.com>
          Description: GenAI-native pixel art format and compiler
           Pixelsrc (pxl) is a GenAI-native pixel art format that enables
           creating and manipulating pixel art through a declarative syntax.
           It supports palettes, layers, animations, and compositions with
           a focus on AI-assisted workflows.
          EOF

          dpkg-deb --build "${PKG_DIR}"
          # dpkg-deb creates PKG_DIR.deb which already has the correct name

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pxl-deb
          path: pxl_*.deb

  checksums:
    name: Generate checksums
    needs: [build, build-deb, verify-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" \) -exec mv {} . \;
          rm -rf pxl-*/ pxl-deb/
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt

  release:
    name: Create release
    needs: [build, build-deb, checksums, verify-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "SHA256SUMS.txt" \) -exec mv {} . \;
          rm -rf pxl-*/ pxl-deb/ checksums/
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: artifacts/*
          # release-plz already wrote the notes from the changelog; keep them.
          generate_release_notes: ${{ inputs.tag == '' }}
          fail_on_unmatched_files: true
