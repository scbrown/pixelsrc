[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n"
footer = "<!-- generated by git-cliff; edit cliff.toml, not CHANGELOG.md -->"
body = """
{%- macro remote_url() -%}
  https://github.com/scbrown/pixelsrc
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
# Preserve the body's trailing newline so adjacent release sections keep a
# blank line between the final list item and the next version heading.
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

# Strip internal ticket IDs from PUBLISHED changelog entries. Commit messages
# keep the refs (internal git history wants them); the public CHANGELOG must
# not carry them — same enforcement split as the pre-push guard, and the same
# preprocessor block quipu's cliff.toml carries. Without this, an entry like
# "... pre-edit guard (<internal-id>)" ships verbatim (it was about to).
commit_preprocessors = [
    # Keep a leading tracker-style subject as a release entry.
    { pattern = '^(?:aegis|hq|gassy|qp|TTP)-[a-z0-9]{3,6}(?:\.[0-9]+)*:[ \t]*', replace = "other: " },
    # "(ID, rest)" -> "(rest)"   e.g. (proj-1a2b, #36/#37) -> (#36/#37)
    { pattern = '\((?:aegis|hq|gassy|qp|TTP)-[a-z0-9]{3,6}(?:\.[0-9]+)*,[ \t]*', replace = "(" },
    # "(rest, ID)" -> "(rest)"
    { pattern = ',[ \t]*(?:aegis|hq|gassy|qp|TTP)-[a-z0-9]{3,6}(?:\.[0-9]+)*\)', replace = ")" },
    # " (ID)" standalone paren -> removed   e.g. ... shape (proj-1a2b) -> ... shape
    { pattern = '[ \t]*\((?:aegis|hq|gassy|qp|TTP)-[a-z0-9]{3,6}(?:\.[0-9]+)*\)', replace = "" },
    # a RUN of bracketed refs -> removed   e.g. ... dirs [proj-1a2b] [proj-3c4d]
    { pattern = '(?:[ \t]*\[(?:aegis|hq|gassy|qp|TTP)-[a-z0-9]{3,6}(?:\.[0-9]+)*\])+', replace = "" },
    # "[ID, rest]" -> "[rest]" and "[rest, ID]" -> "[rest]", mirroring the parens
    { pattern = '\[(?:aegis|hq|gassy|qp|TTP)-[a-z0-9]{3,6}(?:\.[0-9]+)*,[ \t]*', replace = "[" },
    { pattern = ',[ \t]*(?:aegis|hq|gassy|qp|TTP)-[a-z0-9]{3,6}(?:\.[0-9]+)*\]', replace = "]" },
    # any bare leftover " ID"
    { pattern = '[ \t]*\b(?:aegis|hq|gassy|qp|TTP)-[a-z0-9]{3,6}(?:\.[0-9]+)*\b', replace = "" },
]

commit_parsers = [
    { message = "^other", group = "Other" },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^refactor", group = "Changed" },
    { message = "^doc", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^ci", group = "CI/CD" },
    { body = ".*security", group = "Security" },
    { message = "^revert", group = "Reverted" },
]
